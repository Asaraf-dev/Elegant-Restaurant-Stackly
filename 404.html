
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11110F">
    <title>404 - Page Not Found | Stackly Elegant Restaurant</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/404.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <!--- 404 Page --->
    <main class="er-404-page">
        <div class="er-404-particles" id="er404Particles"></div>
        <div class="er-404-decoration er-404-decoration-one"></div>
        <div class="er-404-decoration er-404-decoration-two"></div>
        <div class="container">
            <div class="er-404-content">
                <!--- Error Illustration --->
                <div class="er-404-visual">
                    <span class="er-404-number">4</span>
                    <div class="er-404-center">
                        <div class="er-404-plate">
                            <div class="er-404-plate-inner">
                                <i class="fa-solid fa-utensils"></i>
                            </div>
                        </div>
                    </div>
                    <span class="er-404-number">4</span>
                </div>
                <!--- Error Message --->
                <div class="er-404-message">
                    <span class="er-404-eyebrow">
                        <span></span> LOST YOUR WAY?
                    </span>
                    <h1>This Page Is Off The Menu</h1>
                    <p>It looks like this page has left the table. Don't worry, there's always something wonderful waiting for you at Stackly.</p>
                </div>
                <!--- Action Buttons --->
                <div class="er-404-actions">
                    <button type="button" class="er-404-back-btn" id="er404Back">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Go Back</span>
                    </button>
                    <a href="index.html" class="er-404-home-btn">
                        <span>Back To Home</span>
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
                <!--- Decorative Footer --->
                <div class="er-404-footer">
                    <span></span>
                    <p>AN EXPERIENCE BEYOND THE PLATE</p>
                    <span></span>
                </div>
            </div>
        </div>
    </main>
    <script src="assets/js/404.js"></script>
</body>
</html>
